services:
  hermes:
    build: .
    container_name: hermes
    restart: unless-stopped
    env_file: .env
    environment:
      - HERMES_DOMAIN=${HERMES_DOMAIN}
      - ROUTER9_GATEWAY_URL=${ROUTER9_GATEWAY_URL}
      - ROUTER9_GATEWAY_KEY=${ROUTER9_GATEWAY_KEY}
    networks:
      - hermes-net
    volumes:
      - ./data/hermes:/home/hermes/.hermes
      - ./data/workbench:/workbench
      - ./data/ssh:/home/hermes/.ssh:ro
    stdin_open: true
    tty: true

  caddy:
    image: caddy:latest
    container_name: hermes-caddy
    restart: unless-stopped
    environment:
      - HERMES_DOMAIN=${HERMES_DOMAIN}
    ports:
      - "9180:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - hermes-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
